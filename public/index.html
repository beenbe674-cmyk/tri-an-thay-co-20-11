
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri ân thầy cô 20/11</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;min-height:100vh;
 background:radial-gradient(circle,#64172d,#260710 70%,#100208);
 color:#ffe8b0;
font-family:Arial,sans-serif;
text-align:center;
letter-spacing:normal;
word-spacing:normal;
}
h1{color:#f5d47d;text-shadow:0 0 20px gold;font-size:clamp(28px,5vw,48px)}
main{max-width:950px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}
.panel{padding:22px;border:1px solid #d9ad5b;border-radius:20px;background:#ffffff12}
.heart{
  width:180px;
  height:180px;
  margin:90px auto;
  background:linear-gradient(135deg,#ff6b9a,#e60055,#ff3366);
  position:relative;
  transform:rotate(-45deg);
  animation:pulse 1.5s infinite;
  box-shadow:0 0 25px #ff4775,0 0 50px #d9ad5b;
}
 width:180px;height:180px;margin:90px auto;
 background:linear-gradient(135deg,#ff6684,#a00032);
 position:relative;transform:rotate(-45deg);
 animation:pulse 1.5s infinite;
 box-shadow:0 0 35px #ff4775,0 0 65px #d9ad5b;
}
.heart:before,.heart:after{
 content:"";position:absolute;width:180px;height:180px;
 background:inherit;border-radius:50%;
}
.heart:before{top:-90px;left:0}
.heart:after{left:90px;top:0}
.heart-content{
 position:absolute;inset:0;transform:rotate(45deg);
 z-index:2;display:flex;align-items:center;justify-content:center;
 flex-direction:column;width:180px;height:180px;padding:15px;
 color:white;font-family:Arial;font-size:13px;
}
@keyframes pulse{50%{scale:1.1}}
input,textarea{
 width:100%;padding:13px;margin:8px 0;border-radius:9px;
 border:1px solid #e6c16b;font-size:15px;
}
textarea{height:110px}
button{
 padding:12px 22px;border:0;border-radius:30px;
 background:linear-gradient(90deg,#d9a63e,#ffe7a0);
 color:#451020;font-weight:bold;cursor:pointer;
}
#messages{max-height:180px;overflow:auto;text-align:left;font:14px Arial}
.item{padding:9px;border-bottom:1px solid #d9ad5b55}
#qrcode{background:white;padding:8px;display:inline-block}
.float{position:fixed;bottom:-30px;animation:fly 8s linear forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-110vh) rotate(50deg);opacity:0}}
@media(max-width:700px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>♥ Tri ân thầy cô 20/11 ♥</h1>
<p>Mỗi lời chúc là một đóa hoa gửi đến người lái đò thầm lặng.</p>

<main>
<section class="panel">
 <div class="heart">
  <div class="heart-content">
   <b>TRI ÂN THẦY CÔ</b>
   <p id="heartText">Cảm ơn thầy cô đã dìu dắt chúng em!</p>
  </div>
 </div>
 <h2>Lời chúc yêu thương</h2>
 <div id="messages"></div>
</section>

<section class="panel">
 <h2>Gửi lời chúc đến thầy cô</h2>
 <form id="form">
  <input id="name" maxlength="32" placeholder="Tên của bạn / Tập thể lớp" required>
  <textarea id="message" maxlength="180" placeholder="Viết lời chúc của bạn..." required></textarea>
  <button type="submit">GỬI LỜI CHÚC ♥</button>
 </form>
 <p id="status"></p>
 <h3>Quét QR để gửi lời chúc</h3>
 <div id="qrcode"></div>
 <p><button id="copy">Sao chép đường link</button></p>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
new QRCode($("qrcode"),{text:location.href,width:130,height:130});

$("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText(location.href);$("status").textContent="Đã sao chép đường link!";}
 catch(e){$("status").textContent=location.href;}
};

function safe(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadMessages(){
 try{
  const r=await fetch("/api/messages");
  if(!r.ok)return;
  const data=await r.json();
  $("messages").innerHTML=data.slice(-20).reverse().map(m=>
   `<div class="item"><b>${safe(m.name)}</b>: ${safe(m.message)}</div>`
  ).join("");
  if(data.length){
   const m=data[Math.floor(Date.now()/5000)%data.length];
   $("heartText").textContent=m.message;
  }
 }catch(e){}
}

$("form").onsubmit=async e=>{
 e.preventDefault();
 const btn=e.submitter;
 btn.disabled=true;
 $("status").textContent="Đang gửi...";
 try{
  const r=await fetch("/api/messages",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name:$("name").value,
    message:$("message").value
   })
  });
  const result=await r.json();
  if(!r.ok)throw new Error(result.error||"Gửi thất bại");
  $("message").value="";
  $("status").textContent="♥ Gửi lời chúc thành công!";
  await loadMessages();
 }catch(err){
  $("status").textContent=err.message;
 }finally{btn.disabled=false;}
};

function floating(){
 const el=document.createElement("span");
 el.className="float";
 el.textContent=Math.random()>.4?"♥":"✦";
 el.style.left=Math.random()*100+"vw";
 el.style.color="#f5d47d";
 el.style.fontSize="22px";
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),8500);
}
setInterval(floating,600);
loadMessages();
setInterval(loadMessages,5000);
</script>
</body>
</html>
