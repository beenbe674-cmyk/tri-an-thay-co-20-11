
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri ân thầy cô 20/11</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #70263d, #3b101e 55%, #18060d);
  color: #ffe8b0;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #ffe3a0;
  font-size: clamp(27px, 5vw, 45px);
  text-shadow: 0 0 18px #e9ad55;
  margin: 15px 0;
}

.subtitle {
  color: #ffe5bd;
  font-size: 16px;
  margin-bottom: 30px;
}

main {
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 25px;
  align-items: start;
}

.panel {
  padding: 25px;
  border: 1px solid #d9ad5b;
  border-radius: 22px;
  background: rgba(255,255,255,0.07);
  box-shadow: 0 10px 35px #10020855;
}

h2 {
  color: #ffe4a0;
  font-size: 23px;
}

/* TRÁI TIM LỚN */

.heart-board {
  position: relative;
  width: 100%;
  max-width: 650px;
  min-height: 480px;
  margin: 20px auto;
  padding: 95px 9% 65px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.heart-outline {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.heart-outline path {
  fill: rgba(255, 70, 120, 0.055);
  stroke: #ff9ab5;
  stroke-width: 3;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 8px #ff4775);
  animation: heartGlow 2s ease-in-out infinite alternate;
}

@keyframes heartGlow {
  from {
    stroke: #ff9ab5;
    filter: drop-shadow(0 0 5px #ff4775);
  }
  to {
    stroke: #ffe3a0;
    filter: drop-shadow(0 0 17px #ff4775);
  }
}

.heart-empty {
  position: relative;
  z-index: 1;
  max-width: 240px;
  color: #ffe5bc;
  font-size: 16px;
  line-height: 1.7;
  padding: 15px;
}

.heart-empty .big-heart {
  display: block;
  font-size: 55px;
  color: #ff8cae;
  margin-bottom: 10px;
  animation: beat 1.2s infinite;
}

@keyframes beat {
  50% { transform: scale(1.16); }
}

/* CÁC TẤM NOTE */


#messages {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  padding: 35px 9% 45px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  clip-path: polygon(
    50% 96%, 5% 55%, 0% 38%, 2% 22%,
    12% 10%, 27% 7%, 40% 14%, 50% 27%,
    60% 14%, 73% 7%, 88% 10%, 98% 22%,
    100% 38%, 95% 55%
  );
}

.note {
  min-width: 0;
  min-height: 105px;
  padding: 12px 10px;
  text-align: left;
  border-radius: 8px;
  color: #583346;
  background: #fff0b8;
  box-shadow: 2px 5px 12px #16040b55;
  transform: rotate(-1deg);
  overflow-wrap: anywhere;
  animation: appear 0.5s ease both;
  position: relative;
}

.note:nth-child(3n+2) {
  background: #ffdce7;
  transform: rotate(1.5deg);
}

.note:nth-child(3n) {
  background: #e5f0d9;
  transform: rotate(-1.5deg);
}

.note:nth-child(4n) {
  background: #e4e4ff;
}

.note-name {
  display: block;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px dashed #a77b8a;
}

.note-message {
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}


@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px) rotate(0deg);
  }
  to {
    opacity: 1;
  }
}

.message-count {
  position: relative;
  z-index: 2;
  margin-top: 15px;
  color: #ffe3a0;
  font-size: 14px;
}

/* FORM GỬI LỜI CHÚC */

input, textarea {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #e6c16b;
  border-radius: 11px;
  font-size: 15px;
  font-family: Arial, sans-serif;
  outline: none;
  background: #fffaf1;
  color: #48202d;
}

textarea {
  height: 125px;
  resize: vertical;
}

input:focus, textarea:focus {
  box-shadow: 0 0 0 3px #f5cf7a55;
}

button {
  padding: 13px 25px;
  border: 0;
  border-radius: 30px;
  background: linear-gradient(90deg, #d9a63e, #ffe7a0);
  color: #451020;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px #e6b84e55;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  min-height: 24px;
  color: #ffe5a0;
  overflow-wrap: anywhere;
}

#qrcode {
  display: inline-block;
  padding: 10px;
  background: white;
  border-radius: 8px;
  margin: 8px;
}

.qr-title {
  margin-top: 25px;
  color: #ffe5a0;
}

.copy-button {
  margin-top: 8px;
}

/* HIỆU ỨNG TRÁI TIM BAY */

.float {
  position: fixed;
  bottom: -30px;
  animation: fly 8s linear forwards;
  pointer-events: none;
  z-index: 0;
}

@keyframes fly {
  to {
    transform: translateY(-110vh) rotate(50deg);
    opacity: 0;
  }
}

/* ĐIỆN THOẠI */

@media (max-width: 700px) {
  body {
    padding: 12px;
  }

  main {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .panel {
    padding: 16px;
  }

  .heart-board {
    min-height: 360px;
    padding: 75px 8% 45px;
  }

  #messages {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .note {
    min-height: 100px;
    padding: 10px 8px;
  }

  .note-name {
    font-size: 11px;
  }

  .note-message {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<h1>♥ Tri ân thầy cô 20/11 ♥</h1>

<p class="subtitle">
  Mỗi lời chúc nhỏ ghép thành một trái tim lớn!
</p>

<main>

<!-- KHU VỰC TRÁI TIM -->
<section class="panel">

  <h2>♥ Trái tim tri ân ♥</h2>

  <div class="heart-board">

    <svg class="heart-outline"
         viewBox="0 0 500 460"
         preserveAspectRatio="none">
      <path d="M250 435
      C220 405 25 265 25 145
      C25 35 155 5 250 105
      C345 5 475 35 475 145
      C475 265 280 405 250 435 Z"/>
    </svg>

    <div class="heart-empty" id="emptyHeart">
      <span class="big-heart">♥</span>
      Hãy gửi những lời chúc yêu thương
      để cùng tạo nên trái tim tri ân thầy cô nhé!
    </div>

    <div id="messages"></div>

  </div>

  <div class="message-count" id="messageCount">
    Chờ những lời chúc đầu tiên ♥
  </div>

</section>

<!-- KHU VỰC GỬI LỜI CHÚC -->
<section class="panel">

  <h2>Gửi lời chúc đến thầy cô</h2>

  <form id="form">

    <input
      id="name"
      maxlength="32"
      placeholder="Tên của bạn / Tập thể lớp"
      required
    >

    <textarea
      id="message"
      maxlength="180"
      placeholder="Viết lời chúc của bạn..."
      required
    ></textarea>

    <button type="submit">
      GỬI LỜI CHÚC ♥
    </button>

  </form>

  <p id="status"></p>

  <h3 class="qr-title">Quét QR để gửi lời chúc</h3>

  <div id="qrcode"></div>

  <p>
    <button id="copy" class="copy-button" type="button">
      Sao chép đường link
    </button>
  </p>

</section>

</main>

<script>
const $ = id => document.getElementById(id);

// TẠO QR CODE
new QRCode($("qrcode"), {
  text: location.href,
  width: 150,
  height: 150
});

// SAO CHÉP ĐƯỜNG LINK
$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    $("status").textContent = "♥ Đã sao chép đường link!";
  } catch(e) {
    $("status").textContent = location.href;
  }
};

// CHỐNG CHÈN HTML KHÔNG AN TOÀN
function safe(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

// HIỂN THỊ TẤT CẢ LỜI CHÚC
async function loadMessages() {
  try {
    const r = await fetch("/api/messages");

    if (!r.ok) return;

    const data = await r.json();

    const messages = Array.isArray(data) ? data : [];

    const box = $("messages");

    if (messages.length === 0) {
      box.innerHTML = "";
      $("emptyHeart").style.display = "block";
      $("messageCount").textContent =
        "Chờ những lời chúc đầu tiên ♥";
      return;
    }

    $("emptyHeart").style.display = "none";

    // Hiển thị TOÀN BỘ lời chúc
    box.innerHTML = messages.map((m, index) => `
      <div class="note" style="animation-delay:${Math.min(index * 0.04, 1)}s">
        <span class="note-name">
          ♥ ${safe(m.name || "Ẩn danh")}
        </span>
        <div class="note-message">${safe(m.message || "")}</div>
      </div>
    `).join("");

    $("messageCount").textContent =
      `♥ ${messages.length} lời chúc đã cùng tạo nên trái tim!`;

  } catch(e) {
    console.error("Không tải được lời chúc:", e);
  }
}

// GỬI LỜI CHÚC
$("form").onsubmit = async e => {
  e.preventDefault();

  const btn = e.submitter;
  btn.disabled = true;

  $("status").textContent = "Đang gửi lời chúc...";

  try {
    const r = await fetch("/api/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: $("name").value.trim(),
        message: $("message").value.trim()
      })
    });

    const result = await r.json();

    if (!r.ok) {
      throw new Error(result.error || "Gửi lời chúc thất bại!");
    }

    $("message").value = "";

    $("status").textContent =
      "♥ Gửi lời chúc thành công! Cảm ơn bạn nhé!";

    await loadMessages();

  } catch(err) {
    $("status").textContent = err.message;

  } finally {
    btn.disabled = false;
  }
};

// HIỆU ỨNG TRÁI TIM BAY
function floating() {
  const el = document.createElement("span");

  el.className = "float";
  el.textContent = Math.random() > 0.4 ? "♥" : "✦";
  el.style.left = Math.random() * 100 + "vw";
  el.style.color = "#f5d47d";
  el.style.fontSize = "22px";

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 8500);
}

// KHỞI ĐỘNG
setInterval(floating, 600);

loadMessages();

setInterval(loadMessages, 5000);

</script>

</body>
</html>
